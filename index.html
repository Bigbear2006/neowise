<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    #status { margin: 1rem 0; padding: .5rem .75rem; border-left: 4px solid #555; background: #f2f2f2; color: #111; }
    #status:empty { display: none; }
    #status.ok { border-color: #1a7f37; background: #e9f6ec; }
    #status.warn { border-color: #b45309; background: #fff4e5; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <h2>Черновик ответа</h2>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цена", other: "Другое" };
    const REQUEST_TIMEOUT_MS = 5000;

    const form = document.querySelector("form");
    const input = document.querySelector("#message");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");

    function showStatus(text, kind = "") {
      status.textContent = text;
      status.className = kind;
    }

    function clearDraft() {
      topicEl.textContent = "";
      draftEl.textContent = "";
      result.hidden = true;
    }

    function showManualReview() {
      clearDraft();
      showStatus("Автоматически разобрать заявку не удалось. Прочитайте её и ответьте клиенту вручную: черновика нет.", "warn");
    }

    function showReady({ topic, draft }) {
      showStatus("Заявка разобрана. Проверьте черновик перед отправкой клиенту.", "ok");
      topicEl.textContent = TOPIC_LABELS[topic];
      draftEl.textContent = draft;
      result.hidden = false;
    }

    // Не доверяем ответу сервера: любой неожиданный вид — ручной разбор.
    function isReady(data) {
      return data?.status === "ready"
        && Object.hasOwn(TOPIC_LABELS, data.topic)
        && typeof data.draft === "string"
        && data.draft.trim() !== "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;

      clearDraft(); // черновик от прошлой заявки не должен остаться рядом с новой
      if (input.value.trim() === "") {
        showStatus("Введите текст заявки.", "warn");
        input.focus();
        return;
      }

      button.disabled = true;
      showStatus("Разбираем заявку…");
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input.value }),
          signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
        });
        if (reply.status === 400) {
          showStatus("Сервер не принял текст заявки. Проверьте, что поле заполнено.", "warn");
          return;
        }
        if (!reply.ok) throw new Error(`HTTP ${reply.status}`);
        const data = await reply.json();
        if (isReady(data)) showReady(data);
        else showManualReview();
      } catch {
        showManualReview(); // сеть, таймаут запроса, не-JSON и т.п.
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
